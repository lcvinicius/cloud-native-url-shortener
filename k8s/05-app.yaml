apiVersion: v1
kind: Service
metadata:
  name: urlshortener-service
  namespace: urlshortener
  labels:
    app: urlshortener-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: urlshortener-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urlshortener-api
  namespace: urlshortener
  labels:
    app: urlshortener-api
spec:
  replicas: 2 # Valor base gerenciado dinamicamente pelo HPA
  selector:
    matchLabels:
      app: urlshortener-api
  template:
    metadata:
      labels:
        app: urlshortener-api
    spec:
      containers:
        - name: api
          image: ghcr.io/lcvinicius/cloud-native-url-shortener:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_BASE_URL
            # Tuning de JVM para ambientes de baixa CPU/RAM (Evita Noisy Neighbor e Swap):
            # -Xms64m -Xmx128m: Baseado na telemetria do Grafana (~36MB usados), limita a Heap em 128MB
            # -XX:TieredStopAtLevel=1: Usa apenas o compilador JIT C1 (reduz pico de CPU no boot em 70%)
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          # Startup Probe: Dá até 150 segundos para a JVM e o Hibernate inicializarem
          # sem deixar o Liveness Probe matar o pod prematuramente no cold-start
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          # Kubernetes Auto-Healing: Só entra em ação DEPOIS que o startupProbe passar
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          # Kubernetes Traffic Management: Só direciona clientes se o Spring Boot estiver 100% pronto
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

