apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-shortener
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lcvinicius/cloud-native-url-shortener.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: urlshortener
  # Padrão Enterprise: Manda o ArgoCD ignorar alterações no campo replicas
  # permitindo que o HPA (Horizontal Pod Autoscaler) escale pods livremente sem dar OutOfSync
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: urlshortener-api
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
