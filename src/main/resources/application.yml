server:
  port: 8080

spring:
  application:
    name: cloud-native-url-shortener

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Configurações do Spring Boot Actuator para Kubernetes e Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        # Habilita /actuator/health/liveness e /actuator/health/readiness para o Kubernetes
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

